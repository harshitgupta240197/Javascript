<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET and POST</title>
</head>

<body>

    <h2>GET Request</h2>
    <form action="http://localhost:3000/cars" method="get">
        <input type="text" name="brand">
        <input type="number" name="quantity">
        <button>Submit</button>
    </form>

    <h2>POST Request</h2>
    <form action="http://localhost:3000/cars" method="post">
        <input type="text" name="brand">
        <input type="number" name="quantity">
        <button>Submit</button>
    </form>

</body>

</html>
